# 경로 B(정식 수록) 관문.
#
# 퍼즐 PR이 들어오면 솔버 전수 탐색으로 유일해를 다시 증명한다.
# 이 검사가 통과하지 못하면 병합하지 않는다 — 사람 눈으로 검수하지 않는 대신 여기서 막는다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 전 퍼즐 유일해 검증 + 코덱/규칙 문서 정합성 — 이게 핵심 관문이라 먼저 돌린다
      - name: 퍼즐 유일해 검증
        run: npm test

      # PageProps/LayoutProps는 Next가 생성하는 전역 타입이라
      # typecheck 스크립트가 next typegen을 먼저 실행한다 (깨끗한 클론에서도 통과)
      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 빌드
        run: npm run build
